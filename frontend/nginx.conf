server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }

  # Single-page app: unknown paths (like /admin) serve index.html.
  location / {
    try_files $uri /index.html;
  }
}
