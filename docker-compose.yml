name: busbooking

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bus
      POSTGRES_PASSWORD: bus
      POSTGRES_DB: bus
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus -d bus"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bus:bus@db:5432/bus
      # Scaling knobs. Per process: THREADS <= DB_POOL_SIZE + DB_MAX_OVERFLOW.
      WEB_CONCURRENCY: 2
      THREADS: 4
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
